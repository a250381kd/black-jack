<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BALATRO BLACKJACK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="loading-screen" class="loading-screen" aria-live="polite">
      <div class="loading-content">
        <div class="loader-ring"></div>
        <p>BALATRO</p>
        <span>Inicializando mesa...</span>
      </div>
    </div>

    <div id="game-over-screen" class="game-over-screen hidden" aria-live="polite">
      <div class="game-over-panel">
        <p class="eyebrow">Partida Finalizada</p>
        <h2>SE ACABÓ LA RACHA</h2>
        <p id="game-over-message">Te has quedado sin fichas.</p>
        <button id="restart-button" class="primary">Reintentar</button>
      </div>
    </div>

    <div class="game-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="brand-pill">BLACKJACK</span>
          <h1>BALATRO CARDS</h1>
        </div>

        <div class="scoreboard">
          <div class="score-box">
            <span>Fichas</span>
            <strong id="money">100</strong>
          </div>
          <div class="score-box accent">
            <span>Apuesta</span>
            <strong id="bet-value">10</strong>
          </div>
        </div>
      </header>

      <section class="bet-panel" aria-label="Selecciona apuesta">
        <p>Elige tu apuesta</p>
        <div class="bet-options">
          <button class="bet-button active" data-bet="5">5</button>
          <button class="bet-button" data-bet="10">10</button>
          <button class="bet-button" data-bet="25">25</button>
          <button class="bet-button" data-bet="50">50</button>
        </div>
      </section>

      <main class="table">
        <section class="hand-panel">
          <div class="panel-header">
            <span>Crupier</span>
            <strong id="dealer-score">0</strong>
          </div>
          <div id="dealer-hand" class="hand" aria-label="Cartas del crupier"></div>
        </section>

        <div id="status" class="status-box" data-tone="info">Pulsa "Nueva ronda" para empezar a jugar.</div>

        <section class="hand-panel">
          <div class="panel-header">
            <span>Jugador</span>
            <strong id="player-score">0</strong>
          </div>
          <div id="player-hand" class="hand" aria-label="Cartas del jugador"></div>
        </section>
      </main>

      <nav class="controls" aria-label="Controles del juego">
        <button id="deal-button" class="primary">Nueva Ronda</button>
        <button id="hit-button">Pedir Carta</button>
        <button id="stand-button">Plantarse</button>
      </nav>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
